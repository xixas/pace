name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # System python: gi, cairo and libsecret come from the distro, as in the installed package
      - run: sudo apt-get update && sudo apt-get install -y python3-pytest python3-gi python3-cairo gir1.2-secret-1 dbus
      - run: dbus-run-session -- /usr/bin/python3 -m pytest -q

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gjs
      - run: gjs -m extension/tests/look.test.js
      - run: gjs -m extension/tests/widget.test.js

  data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - run: make check

  plasma:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: pacman -Syu --noconfirm --needed nodejs qt6-declarative >/dev/null
      # The KDE model against the GNOME extension's own fixtures, so look.js and model.js can't drift apart
      - run: TZ=Asia/Kolkata node --test plasma/tests/model.test.mjs
      # Qt's engine must parse every applet file (it rejects syntax gjs accepts)
      - run: /usr/lib/qt6/bin/qmllint plasma/io.github.xixas.Pace/contents/ui/*.qml
      - run: QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 /usr/lib/qt6/bin/qml plasma/tests/model-loads.qml
